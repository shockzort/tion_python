# Разовая подготовка целевого сервера (Raspberry Pi OS / Debian):
#   make provision   (из корня; нужен deploy/ansible/inventory.yml)
# После прогона заполнить на хосте /opt/easy-breezy/.env и frpc.toml,
# затем выкатить версию: make deploy VERSION=x.y.z.
---
- name: Подготовка целевого сервера Easy Breezy
  hosts: all:!backup_vps
  become: true
  vars:
    eb_root: /opt/easy-breezy
    # копия ключа шифрования бэкапов у владельца (без неё архивы не прочесть)
    eb_backup_local_key: "{{ lookup('env', 'HOME') }}/.config/easy-breezy/backup-age.key"
    eb_compose_profiles: tunnel,lan,mqtt # tunnel — frpc наружу, lan — nginx в LAN, mqtt — брокер датчиков
  tasks:
    - name: Пакеты (curl — watchdog, bluez — BLE-стек, sqlite3/age/rsync — бэкапы)
      ansible.builtin.apt:
        name: [curl, bluez, gzip, sqlite3, age, rsync]
        state: present
        update_cache: true

    - name: Проверка docker
      ansible.builtin.command: docker compose version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Установка docker (официальный convenience-скрипт)
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      when: docker_check.rc != 0

    - name: Каталоги
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ eb_root }}"
        - "{{ eb_root }}/data"
        - "{{ eb_root }}/nginx"
        - "{{ eb_root }}/mosquitto/config"

    - name: Каталог данных Mosquitto (пишет uid 1883 из образа)
      ansible.builtin.file:
        path: "{{ eb_root }}/mosquitto/data"
        state: directory
        owner: "1883"
        group: "1883"
        mode: "0755"

    - name: Compose-файл
      ansible.builtin.copy:
        src: ../docker/docker-compose.yml
        dest: "{{ eb_root }}/docker-compose.yml"
        mode: "0644"

    - name: .env из примера (только если ещё нет; заполняет владелец)
      ansible.builtin.copy:
        src: ../../.env.example
        dest: "{{ eb_root }}/.env"
        mode: "0600"
        force: false

    - name: Профиль mqtt в существующем deploy.env (брокер датчиков)
      ansible.builtin.lineinfile:
        path: "{{ eb_root }}/deploy.env"
        regexp: '^COMPOSE_PROFILES=(?!.*\bmqtt\b)(.*)$'
        line: 'COMPOSE_PROFILES=\1,mqtt'
        backrefs: true
      failed_when: false

    - name: deploy.env по умолчанию (версию пишет деплой-плейбук)
      ansible.builtin.copy:
        content: |
          EB_IMAGE_VERSION=none
          COMPOSE_PROFILES={{ eb_compose_profiles }}
        dest: "{{ eb_root }}/deploy.env"
        mode: "0644"
        force: false

    - name: frpc.toml из примера (только если нет; вписать токен VPS)
      ansible.builtin.copy:
        src: ../frp/frpc.toml.example
        dest: "{{ eb_root }}/frpc.toml"
        mode: "0600"
        force: false

    - name: Супервизорный таймаут LE (дефолтные 420 мс рвут слабый линк)
      # Полевой замер 2026-09-14: бризер на -88 dBm жил медианно 15 с и был
      # онлайн 52 % времени. 420 мс = девять пропущенных пакетов подряд при
      # интервале 45 мс; на границе чувствительности это происходит постоянно.
      # 5 с — потолок, дальше бризер сам запрашивает свои 4 с (BlueZ уважает
      # параметры устройства). Радио это не лечит, но короткие замирания
      # перестают рвать соединение.
      ansible.builtin.lineinfile:
        path: /etc/bluetooth/main.conf
        regexp: '^#?ConnectionSupervisionTimeout\s*='
        line: ConnectionSupervisionTimeout=500
        insertafter: '^\[LE\]'
        mode: "0644"
      notify: Перезапустить bluetooth

    - name: Каталог TLS (копия боевого серта — ключ виден только root)
      ansible.builtin.file:
        path: "{{ eb_root }}/tls"
        state: directory
        mode: "0700"

    - name: Конфиг nginx для LAN-входа
      ansible.builtin.copy:
        src: ../nginx/easy-breezy-lan.conf
        dest: "{{ eb_root }}/nginx/easy-breezy-lan.conf"
        mode: "0644"

    - name: Конфиг и права Mosquitto (passwd заводится на хосте, README)
      ansible.builtin.copy:
        src: "../mosquitto/{{ item }}"
        dest: "{{ eb_root }}/mosquitto/config/{{ item }}"
        # mosquitto 2.x требует владельца-пользователя брокера и закрытые права
        owner: "1883"
        group: "1883"
        mode: "0600"
      loop: [mosquitto.conf, acl]
      notify: Перезапустить брокер

    - name: Учётки брокера (пароли в .env — генерируются, если их нет)
      ansible.builtin.script: ../mosquitto/eb-mqtt-setup.sh
      register: mqtt_setup
      # stdout script-модуля идёт через pty (\r\n) — ищем строку целиком
      changed_when: mqtt_setup.stdout is search('^changed\\s*$', multiline=True)
      notify: Перезапустить брокер

    - name: Скрипт доставки сертификата
      ansible.builtin.copy:
        src: ../systemd/eb-cert-sync.sh
        dest: /usr/local/bin/eb-cert-sync.sh
        mode: "0755"

    - name: Watchdog-скрипт
      ansible.builtin.copy:
        src: ../systemd/eb-watchdog.sh
        dest: /usr/local/bin/eb-watchdog.sh
        mode: "0755"

    - name: Скрипт бэкапа на VPS
      ansible.builtin.copy:
        src: ../systemd/eb-backup-offsite.sh
        dest: /usr/local/bin/eb-backup-offsite.sh
        mode: "0755"

    - name: Каталог ключа бэкапов (только root)
      ansible.builtin.file:
        path: "{{ eb_root }}/backup"
        state: directory
        mode: "0700"

    # Ключ age живёт в двух местах: на NUC (шифрует) и у владельца (без него
    # архив с VPS не расшифровать, если NUC умер). Какая сторона есть — та и
    # источник; обе есть и различаются — стоп, ничего не перезаписываем.
    - name: Ключ бэкапов на NUC
      ansible.builtin.stat:
        path: "{{ eb_root }}/backup/age.key"
        get_checksum: true
      register: backup_key_remote

    - name: Ключ бэкапов у владельца
      ansible.builtin.stat:
        path: "{{ eb_backup_local_key }}"
        get_checksum: true
      register: backup_key_local
      delegate_to: localhost
      become: false

    - name: Ключ бэкапов на NUC из копии владельца (переустановка NUC)
      ansible.builtin.copy:
        src: "{{ eb_backup_local_key }}"
        dest: "{{ eb_root }}/backup/age.key"
        mode: "0600"
      when: not backup_key_remote.stat.exists and backup_key_local.stat.exists

    - name: Новый ключ бэкапов
      ansible.builtin.command: age-keygen -o {{ eb_root }}/backup/age.key
      args:
        creates: "{{ eb_root }}/backup/age.key"
      when: not backup_key_remote.stat.exists and not backup_key_local.stat.exists

    - name: Каталог копии ключа у владельца
      ansible.builtin.file:
        path: "{{ eb_backup_local_key | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: not backup_key_local.stat.exists

    - name: Копия ключа бэкапов владельцу
      ansible.builtin.fetch:
        src: "{{ eb_root }}/backup/age.key"
        dest: "{{ eb_backup_local_key }}"
        flat: true
      when: not backup_key_local.stat.exists

    - name: Права копии ключа у владельца
      ansible.builtin.file:
        path: "{{ eb_backup_local_key }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Ключи на NUC и у владельца совпадают
      ansible.builtin.assert:
        that: backup_key_remote.stat.checksum == backup_key_local.stat.checksum
        fail_msg: >-
          {{ eb_root }}/backup/age.key на NUC отличается от {{ eb_backup_local_key }}.
          Разберитесь вручную, какой из них шифрует существующие архивы.
      when: backup_key_remote.stat.exists and backup_key_local.stat.exists

    - name: ssh-ключ доставки бэкапов (на VPS ему разрешён только rrsync)
      ansible.builtin.command: >-
        ssh-keygen -t ed25519 -N "" -C eb-backup@{{ inventory_hostname }}
        -f /root/.ssh/eb-backup
      args:
        creates: /root/.ssh/eb-backup

    - name: Публичный ssh-ключ доставки (для VPS)
      ansible.builtin.slurp:
        src: /root/.ssh/eb-backup.pub
      register: backup_ssh_pub

    - name: Systemd-юниты
      ansible.builtin.copy:
        src: "../systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - easy-breezy.service
        - easy-breezy-watchdog.service
        - easy-breezy-watchdog.timer
        - easy-breezy-cert-sync.service
        - easy-breezy-cert-sync.timer
        - easy-breezy-backup.service
        - easy-breezy-backup.timer

    - name: Автозапуск сервиса (поднимет первый деплой)
      ansible.builtin.systemd:
        daemon_reload: true
        name: easy-breezy.service
        enabled: true

    - name: Watchdog-таймер (enabled + запущен сразу)
      ansible.builtin.systemd:
        name: easy-breezy-watchdog.timer
        enabled: true
        state: started

    - name: Таймер доставки сертификата (ssh-ключ заводится вручную, README)
      ansible.builtin.systemd:
        name: easy-breezy-cert-sync.timer
        enabled: true
        state: started

    - name: Что дальше
      ansible.builtin.debug:
        msg: >-
          Заполните {{ eb_root }}/.env (обязательно EB_TIMEZONE — в контейнере
          системная TZ = UTC) и {{ eb_root }}/frpc.toml, заведите ssh-ключ для
          доставки TLS-серта (deploy/ansible/README.md, «LAN без интернета»),
          затем из корня репозитория: make deploy VERSION=x.y.z

  handlers:
    - name: Перезапустить брокер
      # профиль mqtt включён в deploy.env; сервис подхватит EB_MQTT_URL
      # при следующем деплое/рестарте (systemctl restart easy-breezy)
      ansible.builtin.shell: >-
        cd {{ eb_root }} && docker compose --env-file deploy.env
        up -d --force-recreate mosquitto
      changed_when: true

    - name: Перезапустить bluetooth
      ansible.builtin.systemd:
        name: bluetooth.service
        state: restarted

# Приёмник бэкапов: отдельный пользователь, ключ NUC с forced command
# rrsync -wo — ни шелла, ни чтения, только запись в свой каталог.
- name: Приёмник бэкапов на VPS
  hosts: backup_vps
  become: true
  vars:
    backup_dir: /srv/eb-backup
  tasks:
    - name: rsync (rrsync идёт в том же пакете)
      ansible.builtin.apt:
        name: rsync
        state: present

    - name: Пользователь eb-backup (пароль заблокирован; shell нужен для forced command)
      ansible.builtin.user:
        name: eb-backup
        shell: /bin/sh
        password: "!"
        create_home: true

    - name: Каталог бэкапов
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: eb-backup
        group: eb-backup
        mode: "0700"

    - name: Каталог .ssh пользователя eb-backup
      ansible.builtin.file:
        path: /home/eb-backup/.ssh
        state: directory
        owner: eb-backup
        group: eb-backup
        mode: "0700"

    - name: Ключи NUC в authorized_keys (только rrsync -wo)
      ansible.builtin.copy:
        content: |
          {% for host in groups['all'] | difference(groups['backup_vps']) %}
          {% if hostvars[host].backup_ssh_pub is defined %}
          restrict,command="/usr/bin/rrsync -wo {{ backup_dir }}" {{ hostvars[host].backup_ssh_pub.content | b64decode | trim }}
          {% endif %}
          {% endfor %}
        dest: /home/eb-backup/.ssh/authorized_keys
        owner: eb-backup
        group: eb-backup
        mode: "0600"

    - name: Host-ключ VPS (для known_hosts NUC)
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: vps_host_key

- name: Ночной бэкап на VPS
  hosts: all:!backup_vps
  become: true
  vars:
    eb_root: /opt/easy-breezy
    vps: "{{ hostvars[groups['backup_vps'][0]] }}"
    vps_addr: "[{{ vps.eb_backup_addr }}]:{{ vps.eb_backup_port }}"
  tasks:
    - name: Бэкап на VPS (если в inventory есть группа backup_vps)
      when: "'backup_vps' in groups and groups['backup_vps'] | length > 0"
      block:
        - name: VPS в known_hosts root
          ansible.builtin.known_hosts:
            path: /root/.ssh/known_hosts
            name: "{{ vps_addr }}"
            key: "{{ vps_addr }} {{ (vps.vps_host_key.content | b64decode).split()[:2] | join(' ') }}"

        - name: Настройки бэкапа
          ansible.builtin.copy:
            content: |
              EB_BACKUP_SSH_HOST=eb-backup@{{ vps.eb_backup_addr }}
              EB_BACKUP_SSH_PORT={{ vps.eb_backup_port }}
              EB_BACKUP_KEEP={{ eb_backup_keep | default(7) }}
            dest: "{{ eb_root }}/backup-offsite.env"
            mode: "0644"

        - name: Таймер ночного бэкапа
          ansible.builtin.systemd:
            daemon_reload: true
            name: easy-breezy-backup.timer
            enabled: true
            state: started
