# nginx на NUC: тот же домен, что и снаружи, но вход прямо из LAN.
# Статическая DNS-запись на роутере (easy-breezy.duckdns.org → IP NUC)
# заворачивает домашние устройства сюда, и приложение работает без
# интернета: тот же origin — те же cookie, кэш PWA и APK без пересборки.
# Сертификат настоящий (копия боевого, доставляет eb-cert-sync.sh): на
# домене HSTS, самоподписанный Chrome не пропустит, а TWA не запустится.

upstream easy_breezy_local {
    server 127.0.0.1:8000;
    keepalive 8;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;          # образ фиксирован (1.29), старый синтаксис не нужен
    server_name easy-breezy.duckdns.org;

    ssl_certificate     /etc/easy-breezy/tls/fullchain.pem;
    ssl_certificate_key /etc/easy-breezy/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:EBLAN:1m;

    # те же заголовки, что на VPS: origin один, политика не должна плавать
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://easy_breezy_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket (/api/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name easy-breezy.duckdns.org;
    return 301 https://$host$request_uri;
}
