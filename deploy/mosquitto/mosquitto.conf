# Брокер датчиков Easy Breezy (Qingping по MQTT и прочие сторонние датчики).
# Слушает LAN: наружу через frp не пробрасывается. Анонимный доступ запрещён;
# пароли — хэши в passwd (создаётся на хосте, в git не попадает), права — acl.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
